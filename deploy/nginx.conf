# One hostname serves the React site, Django API, admin, uploads and static files.
# Replace martial.example.com and the deployment paths with the real values.
server {
    listen 80;
    server_name martial.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name martial.example.com;

    ssl_certificate /etc/letsencrypt/live/martial.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/martial.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    location /static/ {
        alias /var/www/martial-arts/staticfiles/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /media/ {
        alias /var/www/martial-arts/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    # Django serves the React index for public routes and handles the API and staff panels.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
