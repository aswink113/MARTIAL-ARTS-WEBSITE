<div class="gt-gallery-tile"
     role="button"
     tabindex="0"
     data-lightbox-trigger
     data-media-type="{{ item.media_type }}"
     data-src="{% if item.image %}{{ item.image.url }}{% else %}/static/images/hero-dojo.jpg{% endif %}"
     data-video-url="{{ item.embed_url }}"
     data-title="{{ item.title }}"
     data-caption="{{ item.caption }}{% if item.event_date %} ({{ item.event_date|date:'M Y' }}){% endif %}">
  {% if item.image %}
    <img src="{{ item.image.url }}" alt="{{ item.title }}">
  {% else %}
    <img src="/static/images/hero-dojo.jpg" alt="{{ item.title }}">
  {% endif %}
  <div class="gt-gallery-caption">
    <div class="d-flex justify-content-between align-items-center mb-1">
      <span class="badge bg-danger">{{ item.category.name }}</span>
      {% if item.media_type == 'video' %}
        <span class="badge bg-warning text-dark"><i class="bi bi-play-fill"></i> Video</span>
      {% endif %}
    </div>
    <h4 class="h6 text-white mb-0">{{ item.title }}</h4>
  </div>
</div>
